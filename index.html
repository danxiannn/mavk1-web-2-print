<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>paged.js simple starter</title>

  <!-- Styles for the web page AND the printed version -->
  <link rel="stylesheet" href="style.css">

  <!-- Styles for the printed version only (because of media="print") -->
  <link rel="stylesheet" href="print.css" media="print">

  <!-- How the print preview looks on screen. You don't need to change it. -->
  <link rel="stylesheet" href="preview.css" data-pagedjs-ignore>

  <!-- Paged.js makes the pages. "auto: false" = wait, script.js will start it. -->
  <script>window.PagedConfig = { auto: false };</script>
  <script src="https://unpkg.com/pagedjs@0.4.3/dist/paged.polyfill.min.js"></script>

  <!-- marked turns Markdown (.md files) into HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>

  <!-- Our script: loads the content files, then starts Paged.js -->
  <script src="script.js" defer></script>
</head>
<body>

  <!-- The cover, written directly in HTML -->
  <section class="cover">
    <h1>BETWEEN EARTH & SKY</h1>
    <h3>— A VISUAL ATLAS OF TIME</h3>
    <p>How do we give shape to something we cannot see?</p>
  </section>

  <!-- The table of contents: links to the chapters below (their id).
       In print, print.css adds the page numbers. -->
  <nav class="toc">
    <h2>Contents</h2>
    <a href="#chapter-1">Mesuring Time</a>
    <a href="#chapter-2">Consectetur adipiscing</a>
    <a href="#chapter-3">Sed do eiusmod</a>
    <a href="#chapter-4">Tempor incididunt</a>
    <a href="#chapter-5">Imagining The Cosmos</a>
  </nav>
  
  <!--
    Each chapter loads its text from a file in the content folder.
    data-src="…" tells script.js which file to put inside the <div>.
    -->
    <section class="intro" id="intro">
      <h1>Introduction</h1>
      <div data-src="content/intro.md"></div>
    </section>

    <section class="chapter" id="chapter-1">
    <!-- <h1>Mesuring Time</h1> -->
    <div data-src="content/chapitre1.md"></div>
    <!-- <div data-src="content/ch-1.json"></div> -->
  </section>
  <!-- Chapter 1: a text file (.txt)
  <section class="chapter" id="chagpter-1">
    <h1>Dolor sit amet</h1>
    <div data-src="content/text.txt"></div>
  </section>
  <section class="chapter" id="chapter-1">
    <h1>Dolor sit amet</h1>
    <div data-src="content/ch-1.json"></div>
  </section>
  <section class="chapter" id="chapter-1">
    <h1>Mesuring Time</h1>
    <div data-src="content/ch-1.html"></div>
  </section> -->

  <!-- Chapter 2: a Markdown file (.md) -->
  <section class="chapter" id="chapter-2">
    <h1>Consectetur adipiscing</h1>
    <div data-src="content/markdown.md"></div>
  </section>

  <!-- Chapter 3: a spreadsheet file (.csv) 电子表格文件 -->
  <section class="chapter" id="chapter-3">
    <h1>Sed do eiusmod</h1>
    <div data-src="content/table.csv"></div>
  </section>

  <!-- Chapter 5: a piece of HTML (.html) -->
  <section class="chapter" id="chapter-5">
    <h1>Ut labore et dolore</h1>
    <div data-src="content/page.html"></div>
  </section>

</body>
</html>
